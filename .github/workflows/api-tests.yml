name: API Tests

on:
  push:
    branches:
      - release
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g newman

      - name: Run all Postman collections
        run: |
          for file in collections/*.json; do
            echo "Running $file"
            newman run "$file"
          done
